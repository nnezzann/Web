<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale 1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Sign up</title>
</head>

<body>
    <div class="full">
        <form action="courses.html" method="post">
            <div class="finside">
                <label for="fname">First name</label>
                <input class="type" type="text" name="fname" id="fname"><br>
                <label for="lname">Last name</label>
                <input class="type" type="text" name="lname" id="lname"><br>
                <label for="email">Email</label>
                <input class="type" type="text" name="email" id="email"><br>
                Gender
                <div class="radios">
                    <label for="male">Male</label>
                    <input class="crazy" type="radio" name="gender" id="male" value="Male">
                    <label for="female">Female</label>
                    <input type="radio" name="gender" id="female" value="Female">
                </div>
                <label for="pass">Password</label>
                <input class="type" type="password" name="password" id="pass">
                <div class="button">
                    <a href="courses.html">Sign Up</a>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
